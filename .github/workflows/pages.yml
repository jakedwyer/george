# Publishes the game to GitHub Pages: https://jakedwyer.github.io/george/
# The site is fully static (index.html + vendored three.js + embedded assets), so the whole
# repo root is uploaded as-is. Runs on pushes to main, or by hand. Only main may deploy: the
# github-pages environment rejects other branches, so feature branches never trigger this.
# The deploy only runs once Pages is switched on for the repo (Settings > Pages > Source:
# "GitHub Actions"); until then the workflow skips it with a warning instead of failing.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  check:
    name: Is Pages enabled?
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is enabled; deploying."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages is not enabled::Deploy skipped. Enable it under Settings > Pages (Source: GitHub Actions) and re-run this workflow to publish https://jakedwyer.github.io/george/"
          fi
  deploy:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp asset URLs with the commit so browsers never reuse a stale script
        run: |
          v="${GITHUB_SHA::8}"
          sed -i -E "s#(src|href)=\"((vendor|assets|js)/[^\"?]+)\"#\1=\"\2?v=$v\"#g" index.html
          grep -o '(src|href)="[^"]*\?v=[^"]*"' -E index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
