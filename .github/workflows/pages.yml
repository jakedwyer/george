# Publishes the game to GitHub Pages: https://jakedwyer.github.io/george/
# The site is fully static (index.html + vendored three.js + embedded assets), so the whole
# repo root is uploaded as-is. Runs on pushes to main and to the active feature branch, or by hand.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main, claude/laxfoo-racing-game-adxym3]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
